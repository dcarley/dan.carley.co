<style>
  /* The image shortcode emits native width/height attributes so the browser
     can reserve space before lazy-loaded images arrive. The theme only caps
     width, which would leave the attribute height in place and stretch the
     image; letting height follow width preserves the aspect ratio. */
  img {
    height: auto;
  }
  /* The youtube shortcode emits a bare iframe, which browsers size at 300x150
     by default. Fill the content column and keep a 16:9 frame so the embed
     scales with the column on narrow viewports. */
  .youtube iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
  }
</style>
{%- if config.extra.google_analytics and config.base_url == "https://dan.carley.co" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ config.extra.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ config.extra.google_analytics }}');
</script>
{%- endif %}
